    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem("lr-theme");
        if (t === "purple" || t === "dark" || t === "minimal") {
          document.documentElement.setAttribute("data-theme", t);
        }
